[package]
name = "scry-web"
# Names the binary (scry-web.exe). Keep in step with tauri.conf.json
# `version`, which is what the bundles are actually stamped with.
version = "0.1.10"
description = "Scry web client (Tauri shell)"
authors = []
license = "GPL-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "scry_web_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# macos-private-api: `.transparent()` is cfg-gated out on macOS without it.
tauri = { version = "2.11.1", features = ["macos-private-api"] }
tauri-plugin-log = "2"

# WS_EX_TOOLWINDOW and the WM_NCHITTEST subclass. Same version tauri already resolves,
# so the HWND types match and the lockfile does not move.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# NSWindow level + collectionBehavior, which the cross-platform API cannot reach.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
