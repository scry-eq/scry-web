name: Electron Release

on:
  push:
    tags: ['v*']

# The tag is the trigger, and the release is written back to it, so the token
# needs write access to contents and nothing else.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifacts: release/*.AppImage
            expect: 1
          - os: windows-latest
            # Both win targets: the NSIS installer and the portable exe.
            artifacts: release/*.exe
            expect: 2
          - os: macos-latest
            # arm64 + x64.
            artifacts: release/*.dmg
            expect: 2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # bun does not run install scripts, so electron's postinstall never fetches
      # the runtime and every later step fails with "Electron failed to install
      # correctly". Same reason `bun run electron:start` needs this locally.
      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js

      # src/gen is gitignored, so a fresh checkout has no protobuf bindings and
      # the typecheck inside the build would fail before anything is compiled.
      - run: bun run gen

      # electron-builder only PACKAGES: it copies `out/` into the asar and never
      # compiles it. Without this the packager still runs, and fails at the very
      # end with `out/main/index.js was not found in this archive`. Locally the
      # directory already existed from a previous run, which is exactly why this
      # was not caught before tagging.
      - name: Compile main, preload and renderer
        run: bun run electron:build

      # THE TAG IS THE VERSION. electron-builder reads it from package.json,
      # which meant tagging without bumping that file first produced artifacts
      # stamped with the previous version — a step easy to forget and invisible
      # until the filenames come out wrong. `extraMetadata.version` overrides it
      # for this build only, without mutating the tree, and it sets the version
      # the packaged app reports as well as the one in the artifact names.
      #
      # package.json keeps its own version as the DEV default, for a local
      # `bun run electron:dist` that has no tag to read.
      - name: Version from the tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '${GITHUB_REF_NAME}' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "building version $v"

      # SIGNING IS OPT-IN VIA SECRETS, and absent secrets this is exactly the
      # unsigned build that shipped v0.1.12. Nothing here fails because a
      # certificate is missing — it only stops warning users when one exists.
      #
      # macOS  MAC_CSC_LINK (base64 .p12), MAC_CSC_KEY_PASSWORD
      #        APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  (notarize)
      # win    AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
      #        + vars AZURE_PUBLISHER_NAME, AZURE_ENDPOINT,
      #          AZURE_CODE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE
      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
        run: |
          extra=()

          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$CSC_LINK" ]; then
              echo "macOS: signing with the supplied Developer ID"
              if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
                # Signing alone does NOT clear Gatekeeper on a downloaded dmg —
                # it has to be notarized and the ticket stapled.
                echo "macOS: notarizing"
                extra+=(--config.mac.notarize=true)
              else
                echo "macOS: signed but NOT notarized — Gatekeeper will still warn"
              fi
            else
              # Without this electron-builder hunts the keychain for an identity;
              # on a runner there is none, and the hunt is noise at best.
              echo "macOS: no certificate — building unsigned"
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          fi

          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CERT_PROFILE" ]; then
              echo "Windows: signing via Azure Trusted Signing"
              extra+=(
                --config.win.azureSignOptions.publisherName="$AZURE_PUBLISHER_NAME"
                --config.win.azureSignOptions.endpoint="$AZURE_ENDPOINT"
                --config.win.azureSignOptions.codeSigningAccountName="$AZURE_CODE_SIGNING_ACCOUNT"
                --config.win.azureSignOptions.certificateProfileName="$AZURE_CERT_PROFILE"
              )
            else
              echo "Windows: no signing credentials — building unsigned"
            fi
          fi

          bunx electron-builder --publish never \
            --config.extraMetadata.version="$APP_VERSION" "${extra[@]}"

      # `fail_on_unmatched_files` only fires when a glob matches NOTHING, so a
      # target that quietly overwrote another still published — v0.1.10 shipped
      # one Windows exe where two were configured, because both targets emitted
      # the same filename. Counting is the check that catches that.
      - name: Check the expected artifacts exist
        shell: bash
        run: |
          ls -la release/ || true
          n=$(ls -1 ${{ matrix.artifacts }} 2>/dev/null | wc -l)
          echo "matched $n file(s), expected ${{ matrix.expect }}"
          if [ "$n" -ne "${{ matrix.expect }}" ]; then
            echo "::error::expected ${{ matrix.expect }} artifact(s) but found $n"
            exit 1
          fi

      - name: Upload to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: scry-web ${{ github.ref_name }}
          prerelease: true
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: true
