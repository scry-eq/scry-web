<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static title is replaced at runtime by src/title.ts with a randomly
         picked innocuous label, so a window-title scan from the EQ client
         won't see the project name or anything else identifying. -->
    <title>Dashboard</title>
    <script>
      // Resolve saved theme + mode synchronously so the first paint
      // matches the user's choice (no flash). Mirrors src/state/theme.ts;
      // keep them in sync if the storage keys or values ever change.
      // Runs before src/state/legacyKeys.ts, so it reads the pre-Scry
      // `showeq.` keys itself rather than flashing on the first load
      // after the rename.
      (function () {
        try {
          var get = function (k) {
            var v = localStorage.getItem('scry.' + k);
            return v === null ? localStorage.getItem('showeq.' + k) : v;
          };
          var mode = get('theme.mode');
          if (mode !== 'light' && mode !== 'dark') mode = 'system';
          var theme = get('theme.name');
          if (theme !== 'shadui') theme = 'default';
          var resolved = mode;
          if (mode === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.mode = resolved;
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.mode = 'dark';
          document.documentElement.dataset.theme = 'default';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
