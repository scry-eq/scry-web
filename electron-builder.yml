appId: com.scryeq.web
productName: scry-web
directories:
  buildResources: build
  # NOT the default `dist` — that is the Vite web bundle's output, and Vite
  # empties its outDir on every build, so installers written there are deleted
  # by the next `bun run build`.
  output: release
files:
  - out/**
  - '!**/*.map'
win:
  target: [nsis, portable]
  artifactName: ${name}-${version}-${arch}.${ext}
mac:
  target: [dmg]
linux:
  target: [AppImage]
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
